  <style>
    :root {
      /* Orange Pop Palette */
      --primary: #FF9F43;
      /* Bright Orange */
      --secondary: #FDC500;
      /* Pop Yellow */
      --accent: #5f27cd;
      /* Purple Accent */
      --bg-color: #FFF8F0;
      /* Warm Cream */
      --text-main: #4E342E;
      /* Dark Brown Text */
      --text-light: #FFFFFF;
      --border-color: #3E2723;
      /* Very Dark Brown Border */
      --shadow-hard: 5px 5px 0px var(--border-color);
      --radius-lg: 25px;
      --radius-md: 15px;
      --font-head: 'Fredoka', sans-serif;
      --font-body: 'Quicksand', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      /* Polka Dot Pattern Background */
      background-image: radial-gradient(var(--secondary) 15%, transparent 16%), radial-gradient(var(--secondary) 15%, transparent 16%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    /* --- LOADING SCREEN --- */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .bouncy-loader {
      width: 60px;
      height: 60px;
      background: var(--primary);
      border-radius: 50%;
      border: 4px solid var(--border-color);
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0) scale(1);
      }

      to {
        transform: translateY(-20px) scale(1.1);
      }
    }

    /* --- CONTAINER --- */
    .app-container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 0;
    }

    /* --- HEADER --- */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .header h1 {
      font-family: var(--font-head);
      font-size: 3.5rem;
      color: var(--border-color);
      text-shadow: 3px 3px 0px #fff;
      margin-bottom: 0.5rem;
      display: inline-block;
      background: #fff;
      padding: 10px 30px;
      border: 4px solid var(--border-color);
      border-radius: 50px;
      box-shadow: var(--shadow-hard);
      animation: wiggle 3s infinite ease-in-out;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(3deg);
      }
    }

    .subtitle {
      font-size: 1.2rem;
      color: #6D4C41;
      font-weight: 600;
      margin-top: 1rem;
    }

    /* --- MAIN MENU BUTTON --- */
    .days-container {
      display: flex;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .main-menu-btn {
      background-color: var(--primary);
      color: white;
      padding: 15px 35px;
      border-radius: 50px;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .main-menu-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0px var(--border-color);
      background-color: var(--secondary);
    }

    .main-menu-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    /* --- SCHEDULE GRID --- */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* --- JURUSAN CARD --- */
    .jurusan-card {
      background: #fff;
      border: 4px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-hard);
      transition: transform 0.3s ease;
    }

    .jurusan-card:hover {
      transform: translateY(-8px) rotate(1deg);
      border-color: var(--primary);
    }

    /* Card Header (Colorful) */
    .jurusan-header {
      background: var(--primary);
      color: white;
      padding: 1.5rem;
      text-align: center;
      border-bottom: 4px solid var(--border-color);
      position: relative;
    }

    .jurusan-header h2 {
      font-family: var(--font-head);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 2px 2px 0px var(--border-color);
    }

    .jurusan-header i {
      font-size: 1.8rem;
    }

    /* Different colors for variety */
    .jurusan-card:nth-child(2) .jurusan-header {
      background: #FF6B6B;
    }

    /* Soft Red */
    .jurusan-card:nth-child(3) .jurusan-header {
      background: #48DBFB;
    }

    /* Sky Blue */
    .jurusan-card:nth-child(4) .jurusan-header {
      background: #5F27CD;
    }

    /* Purple */

    .jurusan-content {
      padding: 1.5rem;
    }

    /* --- MAPEL LINKS --- */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .mapel-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border: 3px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text-main);
      font-weight: 600;
      transition: 0.2s;
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
    }

    .mapel-link:hover {
      background: #FFF3E0;
      transform: translateX(5px);
      border-color: var(--primary);
      box-shadow: 5px 5px 0px var(--border-color);
    }

    .mapel-icon {
      width: 45px;
      height: 45px;
      background: #FFE0B2;
      border: 3px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      color: var(--primary);
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    /* --- FOOTER --- */
    .footer-note {
      background: #fff;
      padding: 2rem;
      border: 3px solid var(--border-color);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-hard);
      margin-top: 2rem;
    }

    .footer-note p {
      margin-bottom: 1rem;
      font-weight: 600;
      color: #8D6E63;
    }

    .footer-note a {
      color: var(--primary);
      font-weight: 700;
      border-bottom: 2px dashed var(--border-color);
    }

    .footer-note a:hover {
      background: var(--secondary);
      color: var(--border-color);
      border-bottom: none;
      border-radius: 5px;
    }

    /* --- RIPPLE EFFECT (CSS + JS) --- */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: scale(0);
      animation: ripple-anim 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2.2rem;
        padding: 10px 20px;
      }

      .schedule-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <script>
      // Hide Loader on Load
      window.addEventListener('load', function () {
        setTimeout(() => {
          const loader = document.getElementById('loader');
          loader.classList.add('hidden');
          setTimeout(() => { loader.style.display = 'none'; }, 500);
        }, 500);
      });

      // Ripple Effect for Buttons and Links
      document.querySelectorAll('.main-menu-btn, .mapel-link').forEach(button => {
        button.addEventListener('click', function (e) {
          // Create ripple element
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');

          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);

          // Positioning
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;

          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';

          this.appendChild(ripple);

          // Remove after animation
          setTimeout(() => {
            ripple.remove();
          }, 600);
        });
      });
    </script>
