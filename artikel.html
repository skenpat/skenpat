<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF9F43" />

    <!-- Meta tags will be updated dynamically -->
    <title>Artikel | Skenpat</title>
    <meta name="description" id="meta-desc" content="Baca artikel menarik dari Skenpat OSIS SMKN 4 Banjarmasin." />

    <link rel="icon" href="https://res.cloudinary.com/dahcxjdbl/image/upload/v1760687917/faviconV2_s4utef.png"
        type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./aset/css/style.css" />
    <style>
        .article-view {
            max-width: 800px;
            margin: 100px auto 50px;
            padding: 30px;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-flat);
            border: var(--border-thin) solid var(--border-color);
        }

        .article-header {
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .article-title {
            font-family: var(--font-head);
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .article-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .article-content {
            line-height: 1.8;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .article-content h3 {
            color: var(--primary-dark);
            margin-top: 2rem;
        }

        .article-content h4 {
            color: var(--text-main);
            margin-top: 1.5rem;
        }

        .article-content ul,
        .article-content ol {
            padding-left: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .article-view {
                margin: 80px 15px 30px;
                padding: 20px;
            }

            .article-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="https://res.cloudinary.com/dahcxjdbl/image/upload/v1766196359/osis4_100x_vnzamj.png"
                    alt="Logo">
                <span>OSIS SMKN4BJM</span>
            </a>
            <ul class="navbar-menu" id="navbar-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="articles.html" class="active">Artikel</a></li>
                <li><a href="index.html?tab=tentang">Tentang</a></li>
            </ul>
            <div class="navbar-actions">
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="navbar-toggle" id="navbar-toggle" aria-label="Toggle navigation">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Back to Top -->
    <button class="back-to-top" id="backToTop" aria-label="Kembali ke atas">
        <i class="fas fa-arrow-up"></i>
    </button>

    <div class="article-view">
        <a href="articles.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali ke Artikel</a>

        <div id="loading-state" style="text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: var(--primary);"></i>
            <p style="margin-top: 15px;">Memuat artikel...</p>
        </div>

        <div id="article-container" style="display: none;">
            <div class="article-header">
                <span id="art-category" class="badge"
                    style="background: var(--primary); color: white; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem;">Category</span>
                <h1 id="art-title" class="article-title">Judul Artikel</h1>
                <div class="article-meta">
                    <span><i class="fas fa-user"></i> <span id="art-author">Author</span></span>
                    <span><i class="fas fa-calendar"></i> <span id="art-date">Date</span></span>
                </div>
            </div>

            <div id="art-content" class="article-content">
                <!-- Content injected here -->
            </div>
        </div>

        <div id="error-state" style="display: none; text-align: center; padding: 50px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #e74c3c;"></i>
            <h3>Artikel Tidak Ditemukan</h3>
            <p>Maaf, artikel yang Anda cari tidak tersedia atau telah dihapus.</p>
            <a href="articles.html" class="cta-pill primary" style="display: inline-block; margin-top: 20px;">Lihat
                Artikel Lainnya</a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div style="margin-top:15px;">
            &copy; 2026 Skenpat Pages | OSIS SMKN 4 Banjarmasin
        </div>
    </footer>

    <script>
        const initTheme = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.querySelector('#theme-toggle i');
            if (icon) icon.className = savedTheme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        };
        const toggleTheme = () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.querySelector('#theme-toggle i');
            if (icon) icon.className = newTheme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
        };

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('navbar-toggle').addEventListener('click', () => {
            const menu = document.getElementById('navbar-menu');
            menu.classList.toggle('active');
            const icon = document.querySelector('#navbar-toggle i');
            icon.className = menu.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
        });

        // Navbar & Scroll Logic
        const backBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');

            if (window.scrollY > 300) backBtn.classList.add('visible');
            else backBtn.classList.remove('visible');
        });

        backBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Load Article
        const loadArticle = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (!articleId) {
                showError();
                return;
            }

            try {
                const res = await fetch('./api/articles.json');
                const articles = await res.json();
                const article = articles.find(a => a.id === articleId);

                if (article) {
                    // Update DOM
                    document.getElementById('art-title').textContent = article.title;
                    document.getElementById('art-category').textContent = article.category;
                    document.getElementById('art-author').textContent = article.author;
                    document.getElementById('art-date').textContent = article.date;
                    document.getElementById('art-content').innerHTML = article.content;

                    // Update SEO
                    document.title = `${article.title} | Skenpat OSIS SMKN 4 Banjarmasin`;
                    document.getElementById('meta-desc').setAttribute('content', article.meta_desc || article.summary);

                    // Show content
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('article-container').style.display = 'block';
                } else {
                    showError();
                }
            } catch (err) {
                console.error(err);
                showError();
            }
        };

        const showError = () => {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        };

        initTheme();
        loadArticle();
    </script>
</body>

</html>
