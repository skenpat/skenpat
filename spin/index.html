<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B35">
    <title>Wheel Spinner Skenpat Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Palette */
            --primary: #FF6B35;
            --primary-hover: #E85D2C;
            --bg-body: #F8F9FA;
            --bg-surface: #FFFFFF;
            --bg-glass: rgba(255, 255, 255, 0.85);

            --text-main: #1E293B;
            --text-muted: #64748B;

            --border-light: #E2E8F0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);

            --radius-md: 12px;
            --radius-full: 9999px;

            --header-height: 70px;
        }

        [data-theme="dark"] {
            --bg-body: #0F172A;
            --bg-surface: #1E293B;
            --bg-glass: rgba(30, 41, 59, 0.85);
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border-light: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--header-height));
            position: relative;
            overflow: hidden;
        }

        /* --- Header --- */
        .app-header {
            height: var(--header-height);
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary);
        }

        /* --- Wheel Stage (IMG BASED) --- */
        .wheel-stage {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            /* Drop shadow for the wheel */
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.2));
        }

        /* THE MAIN IMAGE - Using CSS Transform for rotation */
        #wheelImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            /* The Spin Physics */
            will-change: transform;
        }

        /* The Pointer */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            /* Slight overlap */
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .wheel-pointer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 50px solid var(--primary);
        }

        /* Hidden canvas used only to generate the image */
        #generatorCanvas {
            display: none;
        }

        /* Center Spin Button */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            /* Above image */
            border: 4px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .center-circle:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-circle i {
            color: var(--primary);
            font-size: 1.5rem;
        }

        /* --- Controls Panel --- */
        .controls-panel {
            width: 400px;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            z-index: 40;
            transition: transform 0.3s ease;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.05);
        }

        .controls-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .tabs {
            display: flex;
            background: var(--bg-body);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        .tab-content {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            background: var(--bg-body);
            color: var(--text-main);
            font-family: inherit;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-body);
            color: var(--text-main);
            border: 1px solid var(--border-light);
        }

        .btn-danger {
            background: #FEE2E2;
            color: #DC2626;
        }

        /* Mobile Bottom Sheet */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }

            .controls-panel {
                width: 100%;
                height: 60vh;
                position: absolute;
                bottom: 0;
                left: 0;
                border-top: 1px solid var(--border-light);
                border-radius: 20px 20px 0 0;
                transform: translateY(100%);
                box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            }

            .controls-panel.open {
                transform: translateY(0);
            }

            .mobile-toggle {
                position: absolute;
                top: -50px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-surface);
                padding: 8px 24px;
                border-radius: 20px;
                box-shadow: var(--shadow-md);
                border: 1px solid var(--border-light);
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.85rem;
                font-weight: 600;
                cursor: pointer;
                z-index: 41;
            }

            .wheel-stage {
                height: 40vh;
                padding-bottom: 80px;
            }
        }

        @media (min-width: 901px) {
            .mobile-toggle {
                display: none;
            }
        }

        /* Modal & Toast */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-surface);
            width: 90%;
            max-width: 400px;
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-backdrop.active .modal-card {
            transform: translateY(0);
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-surface);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            animation: slideIn 0.3s forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand"><i class="fas fa-dharmachakra"></i> Skenpat Wheel</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
            <button class="icon-btn" onclick="toggleSound()"><i class="fas fa-volume-up" id="sound-icon"></i></button>
        </div>
    </header>

    <div class="app-container">
        <!-- MAIN IMAGE WHEEL -->
        <main class="wheel-stage">
            <div class="canvas-container">
                <div class="wheel-pointer"></div>
                <!-- The visible Image Element -->
                <img id="wheelImage" src="" alt="Wheel Spinner" draggable="false">
            </div>
        </main>

        <!-- CONTROLS -->
        <aside class="controls-panel" id="controlsPanel">
            <div class="mobile-toggle" onclick="togglePanel()">
                <i class="fas fa-chevron-up" id="panelChevron"></i> Edit Wheel
            </div>

            <div class="controls-header">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('input', this)">Input</button>
                    <!-- Dynamic shortcuts container -->
                    <div id="shortcutsContainer" style="display:contents">
                        <!-- Custom shortcuts will be injected here -->
                    </div>
                    <!-- Default tools -->
                    <button class="shortcut-btn" onclick="shuffleWheel()" aria-label="Acak item">
                        <i class="fas fa-random"></i>
                    </button>
                    <button class="shortcut-btn" onclick="sortWheel()" aria-label="Urutkan item A-Z">
                        <i class="fas fa-sort-alpha-down"></i>
                    </button>
                    <button class="tab-btn" onclick="switchTab('settings', this)">Settings</button>
                </div>
            </div>

            <!-- Tab 1 -->
            <div id="tab-input" class="tab-content active">
                <textarea id="textInput" placeholder="Add names here...&#10;Hafizh&#10;Arsidi&#10;Daus"></textarea>
                <div class="action-grid">
                    <button class="btn btn-secondary" onclick="shuffleWheel()"><i class="fas fa-random"></i>
                        Shuffle</button>
                    <button class="btn btn-secondary" onclick="sortWheel()"><i class="fas fa-sort-alpha-down"></i>
                        Sort</button>
                    <button class="btn btn-danger" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
                    <button class="btn btn-primary" onclick="spin()"><i class="fas fa-play"></i> SPIN</button>
                </div>
            </div>

            <!-- Tab 2 -->
            <div id="tab-settings" class="tab-content">
                <div class="setting-row" style="display:flex; justify-content:space-between; padding:10px 0;">
                    <span>Spin Duration</span>
                    <input type="range" id="durationRange" min="1" max="10" value="5"
                        oninput="updateDuration(this.value)">
                </div>

                <div class="setting-group"
                    style="margin-top:20px; border-top:1px dashed var(--border-light); padding-top:15px;">
                    <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Share Setup</h4>
                    <button class="btn btn-primary" onclick="shareCurrentUrl()"><i class="fas fa-link"></i> Copy
                        Link</button>
                </div>

                <div class="setting-group"
                    style="margin-top:20px; border-top:1px dashed var(--border-light); padding-top:15px;">
                    <h4 style="margin:0 0 10px 0; color:var(--text-muted);">Manage Shortcuts</h4>
                    <input type="text" id="newShortcutName" placeholder="Nama Shortcut (e.g. X RPL 1)"
                        style="width:100%; padding:8px; margin-bottom:8px; border:1px solid var(--border-light); border-radius:6px;">
                    <textarea id="newShortcutContent" placeholder="Items (one per line)"
                        style="width:100%; height:80px; padding:8px; margin-bottom:8px; border:1px solid var(--border-light); border-radius:6px; resize:none;"></textarea>
                    <button class="btn btn-secondary" onclick="addCustomShortcut()" style="width:100%">+ Save
                        Shortcut</button>

                    <div id="customShortcutsList"
                        style="margin-top:15px; display:flex; flex-direction:column; gap:8px;">
                        <!-- List of custom shortcuts -->
                    </div>
                </div>

                <div class="action-grid" style="margin-top:20px;">
                    <button class="btn btn-secondary" onclick="loadTemplate('yesno')">Ya / Tidak</button>
                    <button class="btn btn-secondary" onclick="loadTemplate('numbers')">1-6</button>
                    <button class="btn btn-secondary" onclick="loadTemplate('xrpl1')">X RPL 1</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- MODAL -->
    <div class="modal-backdrop" id="resultModal">
        <div class="modal-card">
            <div style="font-size: 3rem;">🎉</div>
            <h3 style="color:var(--text-muted); margin:0;">Putaran Menunjukkk</h3>
            <div id="winnerName" style="font-size: 2rem; font-weight: 800; color: var(--primary); margin: 20px 0;">Name
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" onclick="closeModal()">OK</button>
                <button class="btn btn-danger" onclick="removeWinner()">Hapus Pemenang</button>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- HIDDEN GENERATOR CANVAS -->
    <canvas id="generatorCanvas" width="1000" height="1000"></canvas>

    <script>
        /* --- CONFIG --- */
        const colors = ['#FF6B35', '#F7931E', '#FFC947', '#FF5733', '#C70039', '#900C3F', '#581845', '#4CC9F0', '#4361EE', '#3A0CA3', '#7209B7', '#B5179E', '#F72585', '#28A745', '#20C997', '#17A2B8'];

        const state = {
            segments: [],
            rotation: 0, // In degrees
            isSpinning: false,
            soundEnabled: true,
            duration: 5
        };

        /* --- DOM ELEMENTS --- */
        const textInput = document.getElementById('textInput');
        const wheelImg = document.getElementById('wheelImage');
        const generatorCanvas = document.getElementById('generatorCanvas');
        const ctx = generatorCanvas.getContext('2d');
        const resultModal = document.getElementById('resultModal');

        /* --- INIT --- */
        window.addEventListener('DOMContentLoaded', () => {
            // Load defaults
            if (localStorage.getItem('skenpatData')) {
                const data = JSON.parse(localStorage.getItem('skenpatData'));
                textInput.value = data.text;
                state.segments = data.segments || [];
                state.rotation = data.rotation || 0;
            } else {
                textInput.value = "Prize 1\nPrize 2\nPrize 3\nPrize 4\nPrize 5\nPrize 6";
            }

            // Advanced Features Init
            renderShortcuts();
            checkUrlParams();

            parseInput();
            updateWheelImage(); // Generates the image

            // Apply initial rotation from storage
            wheelImg.style.transform = `rotate(${state.rotation}deg)`;

            // Event Listeners
            textInput.addEventListener('input', debounce(() => {
                parseInput();
                updateWheelImage();
            }, 300));

            wheelImg.addEventListener('transitionend', () => {
                // Spin finished
                state.isSpinning = false;
                calculateWinner();
            });
        });

        /* --- CORE LOGIC --- */
        function parseInput() {
            const lines = textInput.value.split('\n').filter(line => line.trim() !== '');
            state.segments = lines;
        }

        // 1. Draw on hidden Canvas
        // 2. Export to Image Data URL
        // 3. Set to <img> src
        function updateWheelImage() {
            const size = 1000; // High resolution for crisp image
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = (size / 2) - 10;

            ctx.clearRect(0, 0, size, size);

            if (state.segments.length === 0) {
                // Empty state
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f0f0f0';
                ctx.fill();
                // Set empty placeholder
                wheelImg.src = generatorCanvas.toDataURL();
                return;
            }

            const sliceAngle = (2 * Math.PI) / state.segments.length;
            const fontSize = Math.max(30, 400 / state.segments.length); // Responsive font size

            ctx.font = `bold ${fontSize}px 'Plus Jakarta Sans'`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';

            state.segments.forEach((segment, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.fillStyle = 'white';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 4;
                ctx.fillText(segment, radius - 30, 0);
                ctx.restore();
            });

            // Convert to Image
            wheelImg.src = generatorCanvas.toDataURL('image/png');
        }

        /* --- SPINNING --- */
        function spin() {
            if (state.isSpinning || state.segments.length === 0) {
                if (state.segments.length === 0) showToast("Add entries first!", "error");
                return;
            }

            state.isSpinning = true;
            playSound('click');

            // Calculate new rotation
            // Add at least 5 full spins (1800 deg) + random offset
            const extraSpins = 5 + Math.floor(Math.random() * 5);
            const randomOffset = Math.floor(Math.random() * 360);

            // We need to add to the CURRENT rotation so it doesn't snap back
            const totalRotation = state.rotation + (extraSpins * 360) + randomOffset;

            // Apply CSS Transform
            wheelImg.style.transform = `rotate(${totalRotation}deg)`;

            // Update state for calculation later
            // We normalize it modulo 360 for storage, but keep the large number for the CSS transition
            state.rotation = totalRotation;
        }

        function calculateWinner() {
            // Normalize rotation to 0-360
            const normalizedRotation = state.rotation % 360;

            // The pointer is at the TOP (270 degrees or -90 degrees in canvas space).
            // If the wheel rotates CLOCKWISE, the "slice" at 270deg changes.
            // Let's calculate which index is at the top.

            // The angle "under" the pointer:
            // Since we rotate the image clockwise, the index at the top is calculated by:
            // (360 - currentRotation) + 270 (top position) normalized.

            // Simplified Math:
            // Pointer is static at Top.
            // Wheel angle `theta` represents how much it turned.
            // The segment at Top is the one that originally was at `270 - theta`.

            const pointerAngle = 270; // Top of circle in degrees
            // Effective angle of the slice under the pointer
            let effectiveAngle = (pointerAngle - normalizedRotation) % 360;
            if (effectiveAngle < 0) effectiveAngle += 360;

            const sliceSize = 360 / state.segments.length;
            const winnerIndex = Math.floor(effectiveAngle / sliceSize);

            announceWinner(state.segments[winnerIndex]);
        }

        /* --- WINNER --- */
        function announceWinner(name) {
            document.getElementById('winnerName').textContent = name;
            resultModal.classList.add('active');
            playSound('win');
            fireConfetti();
            saveState();
        }

        function closeModal() {
            resultModal.classList.remove('active');
        }

        /* --- UTILS --- */
        function shuffleWheel() {
            const arr = state.segments;
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            textInput.value = arr.join('\n');
            parseInput();
            updateWheelImage();
            showToast("Shuffled!");
        }

        function sortWheel() {
            state.segments.sort();
            textInput.value = state.segments.join('\n');
            updateWheelImage();
            showToast("Sorted!");
        }

        function removeWinner() {
            const winnerName = document.getElementById('winnerName').textContent;
            const index = state.segments.indexOf(winnerName);
            if (index > -1) {
                state.segments.splice(index, 1);
                textInput.value = state.segments.join('\n');
                updateWheelImage();
                saveState();
                closeModal();
                showToast("Pemenang dihapus!");
            }
        }

        function clearAll() {
            if (confirm('Hapus semua konten dan reset putaran?')) {
                textInput.value = '';
                state.rotation = 0;
                wheelImg.style.transition = 'none';
                wheelImg.style.transform = 'rotate(0deg)';
                // Force a reflow to make the transition 'none' apply immediately
                void wheelImg.offsetHeight;
                wheelImg.style.transition = `transform ${state.duration}s cubic-bezier(0.15, 0, 0.15, 1)`;

                parseInput();
                updateWheelImage();
                saveState();
                showToast("Dibersihkan!");
            }
        }

        function loadTemplate(type) {
            if (type === 'yesno') textInput.value = "Ya\nTidak";
            if (type === 'numbers') textInput.value = "1\n2\n3\n4\n5\n6";
            if (type === 'xrpl1') textInput.value = "Alya\nReza\nAmel\nRezki\nFadil\nRazen\nAnggun\nFarel\nRirin\nSyva\nAdit\nYorda\nRaisya\nArsidi\nSyilla\nDaus\nAisyah\nNiko\nAlisya\nThio\nNaura\nDanuri\nMarsya\nHamka\nAwa\nRaffa\nAurel\nKarim\nUlfa\nIbnu\nKeyrel\nJaffar\nHafizh\nHafi\nAnshori";
            parseInput();
            updateWheelImage();
            saveState();
            switchTab('input', document.querySelector('.tab-btn:first-child'));
            showToast("Template dimuat!");
        }

        function updateDuration(val) {
            state.duration = val;
            document.getElementById('durationValue').textContent = val;
            // Update CSS transition time (just for display/logic, actual transition set in spin() via JS or style injection)
            wheelImg.style.transition = `transform ${val}s cubic-bezier(0.15, 0, 0.15, 1)`;
        }

        /* --- SHORTCUTS & SHARING --- */
        function addCustomShortcut() {
            const name = document.getElementById('newShortcutName').value.trim();
            const content = document.getElementById('newShortcutContent').value.trim();

            if (!name || !content) {
                showToast("Nama dan Isi konten diperlukan!");
                return;
            }

            const shortcuts = JSON.parse(localStorage.getItem('spinShortcuts') || '[]');
            shortcuts.push({ name, content });
            localStorage.setItem('spinShortcuts', JSON.stringify(shortcuts));

            document.getElementById('newShortcutName').value = '';
            document.getElementById('newShortcutContent').value = '';

            renderShortcuts();
            showToast("Shortcut Tersimpan!");
        }

        function deleteShortcut(index) {
            if (confirm("Hapus shortcut berikut?")) {
                const shortcuts = JSON.parse(localStorage.getItem('spinShortcuts') || '[]');
                shortcuts.splice(index, 1);
                localStorage.setItem('spinShortcuts', JSON.stringify(shortcuts));
                renderShortcuts();
            }
        }

        function loadShortcut(content) {
            textInput.value = content;
            parseInput();
            updateWheelImage();
            saveState();
            switchTab('input', document.querySelector('.tab-btn:first-child'));
            showToast("Loaded!");
        }

        function renderShortcuts() {
            const shortcuts = JSON.parse(localStorage.getItem('spinShortcuts') || '[]');
            const container = document.getElementById('shortcutsContainer');
            const list = document.getElementById('customShortcutsList');

            // 1. Render Buttons in Header
            container.innerHTML = '';
            shortcuts.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'shortcut-btn';
                btn.title = s.name;
                // Generate a pseudo-random icon or Initial
                btn.innerHTML = `<span style="font-weight:800">${s.name.substring(0, 2).toUpperCase()}</span>`;
                btn.onclick = () => loadShortcut(s.content);
                container.appendChild(btn);
            });

            // 2. Render List in Settings
            list.innerHTML = '';
            if (shortcuts.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-style:italic;">No custom shortcuts yet</div>';
            } else {
                shortcuts.forEach((s, i) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'background:var(--bg-body); padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border-light);';
                    item.innerHTML = `
                        <div>
                            <div style="font-weight:700">${s.name}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">${s.content.replace(/\n/g, ', ')}</div>
                        </div>
                        <button class="btn btn-danger" style="width:auto; padding:5px 10px;" onclick="deleteShortcut(${i})"><i class="fas fa-trash"></i></button>
                    `;
                    list.appendChild(item);
                });
            }
        }

        function shareCurrentUrl() {
            const data = btoa(encodeURIComponent(textInput.value));
            const url = new URL(window.location.href);
            url.searchParams.set('data', data);

            navigator.clipboard.writeText(url.toString()).then(() => {
                showToast("Link Copied!");
            });
        }

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                try {
                    const decoded = decodeURIComponent(atob(data));
                    textInput.value = decoded;
                    parseInput();
                    updateWheelImage();
                    // Clear param so it doesn't stick
                    window.history.replaceState({}, document.title, window.location.pathname);
                    showToast("Wheel Loaded from Link!");
                } catch (e) {
                    console.error(e);
                    showToast("Invalid Shared Link");
                }
            }
        }

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('theme-icon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            document.getElementById('sound-icon').className = state.soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function debounce(func, wait) {
            let timeout;
            return (...args) => clearTimeout(timeout) || (timeout = setTimeout(() => func(...args), wait));
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
        }

        function togglePanel() {
            document.getElementById('controlsPanel').classList.toggle('open');
            document.getElementById('panelChevron').classList.toggle('fa-chevron-down');
            document.getElementById('panelChevron').classList.toggle('fa-chevron-up');
        }

        function saveState() {
            localStorage.setItem('skenpatData', JSON.stringify({
                text: textInput.value,
                segments: state.segments,
                rotation: state.rotation % 360
            }));
        }

        /* --- AUDIO & CONFETTI --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!state.soundEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'click') {
                osc.frequency.value = 600; osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.value = 880; osc.type = 'triangle';
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function fireConfetti() {
            // Simple DOM confetti for visual flair
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.style.position = 'fixed';
                c.style.left = '50%'; c.style.top = '50%';
                c.style.width = '10px'; c.style.height = '10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.transition = '1s ease-out';
                c.style.zIndex = '9999';
                document.body.appendChild(c);

                // Explosion
                setTimeout(() => {
                    const x = (Math.random() - 0.5) * window.innerWidth;
                    const y = (Math.random() - 0.5) * window.innerHeight;
                    c.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random() * 360}deg)`;
                    c.style.opacity = 0;
                }, 10);

                setTimeout(() => c.remove(), 1000);
            }
        }
    </script>
