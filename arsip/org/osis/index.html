<!doctype html>
<html lang="id" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arsip OSIS — SMK Negeri 4 Banjarmasin</title>
  <meta name="description"
    content="Arsip Digital Organisasi Siswa Intra Sekolah (OSIS) SMKN 4 Banjarmasin. Temukan riwayat kepengurusan, dokumentasi kegiatan, dan pembina OSIS dari tahun ke tahun.">

  <!-- Fonts: Fredoka (Cartoon Headings) & Nunito (Readable Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* --- CSS CARTOON THEME --- */
    :root {
      /* Palette */
      --primary: #FF6B35;
      /* Vibrant Orange */
      --primary-hover: #E85D2A;
      --secondary: #FFD93D;
      /* Cartoon Yellow */
      --accent: #00B4D8;
      /* Sky Blue */
      --bg-body: #FFF8F0;
      /* Warm Cream */
      --bg-card: #FFFFFF;
      --text-main: #2D3436;
      --text-muted: #636E72;

      /* Cartoon Style Variables */
      --border-color: #000000;
      --border-width: 3px;
      --shadow-hard: 5px 5px 0px var(--border-color);
      --shadow-hover: 7px 7px 0px var(--border-color);
      --shadow-active: 2px 2px 0px var(--border-color);

      --radius-xl: 25px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    /* Dark Mode Override */
    [data-theme="dark"] {
      --bg-body: #1E1E24;
      --bg-card: #2B2B36;
      --text-main: #F0F0F0;
      --text-muted: #A0A0A0;
      --border-color: #FFFFFF;
      --shadow-hard: 5px 5px 0px rgba(255, 255, 255, 0.2);
      --shadow-hover: 7px 7px 0px rgba(255, 255, 255, 0.3);
      --shadow-active: 2px 2px 0px rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    h1,
    h2,
    h3,
    h4,
    h5 {
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* --- HEADER --- */
    .header {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-hard);
      padding: 2.5rem 1.5rem;
      margin-bottom: 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Decorative Circle */
    .header::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: var(--secondary);
      border-radius: 50%;
      border: var(--border-width) solid var(--border-color);
      z-index: 0;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0px var(--border-color);
    }

    .header .subtitle {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2rem;
      background: var(--bg-body);
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* --- BUTTONS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      background: var(--bg-card);
      box-shadow: var(--shadow-hard);
      text-transform: uppercase;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: var(--shadow-active);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-outline {
      background-color: white;
      color: var(--text-main);
    }

    [data-theme="dark"] .btn-outline {
      background-color: var(--bg-card);
    }

    .btn-outline:hover {
      background-color: var(--secondary);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border-radius: var(--radius-md);
    }

    /* --- SEARCH SECTION --- */
    .search-section {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-hard);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .search-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.2rem 1rem 3.5rem;
      border: var(--border-width) solid var(--border-color);
      border-radius: 50px;
      font-size: 1.1rem;
      background: var(--bg-body);
      color: var(--text-main);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      outline: none;
      box-shadow: inset 3px 3px 0px rgba(0, 0, 0, 0.1);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 1.2rem;
    }

    .search-stats {
      text-align: center;
      margin-top: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-body);
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      border: 2px solid var(--border-color);
    }

    /* --- TABS --- */
    .tab-nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
    }

    .tab-btn {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border-color);
      padding: 0.8rem 2rem;
      border-radius: 50px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      box-shadow: var(--shadow-hard);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      transform: translateY(-4px);
      box-shadow: 0 0 0 var(--border-color);
      /* Remove shadow to look "pressed up" */
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- FILTERS --- */
    .filter-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 0.7rem 1.5rem;
      border: var(--border-width) solid var(--border-color);
      border-radius: 50px;
      background: var(--bg-card);
      color: var(--text-main);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
    }

    /* --- CARDS --- */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .archive-card {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-hard);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .archive-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    .archive-header {
      background: var(--primary);
      color: white;
      padding: 1.2rem;
      border-bottom: var(--border-width) solid var(--border-color);
    }

    .archive-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .archive-subtitle {
      font-size: 0.95rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .archive-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: var(--border-width) solid var(--border-color);
      background-color: var(--bg-body);
    }

    .archive-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .archive-desc-preview {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .archive-actions {
      margin-top: auto;
    }

    .archive-actions .btn {
      width: 100%;
      justify-content: center;
    }

    /* --- PAGINATION --- */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 3rem;
    }

    .page-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      border: var(--border-width) solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      border-radius: 50%;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-color);
    }

    .page-btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .page-btn.active {
      background: var(--secondary);
      border-color: var(--border-color);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* --- FOOTER --- */
    .footer {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2rem;
      text-align: center;
      margin-top: 4rem;
      box-shadow: var(--shadow-hard);
    }

    /* --- MODAL (ARTICLE) --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      border-radius: var(--radius-xl);
      border: var(--border-width) solid var(--border-color);
      box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.3);
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      position: relative;
      height: 250px;
      border-bottom: var(--border-width) solid var(--border-color);
    }

    .modal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--danger);
      color: white;
      border: 2px solid var(--border-color);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 3px 3px 0px var(--border-color);
      z-index: 10;
      transition: transform 0.2s;
    }

    .close-modal:hover {
      transform: scale(1.1);
    }

    .close-modal:active {
      transform: scale(0.95) translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-color);
    }

    .modal-body {
      padding: 2rem;
    }

    .modal-tag {
      display: inline-block;
      background: var(--secondary);
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .article-section {
      margin-bottom: 2rem;
    }

    .article-section h3 {
      color: var(--primary);
      font-size: 1.5rem;
      border-bottom: 3px dashed var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .article-text {
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .article-text strong {
      color: var(--text-main);
    }

    .member-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .member-item {
      background: var(--bg-body);
      padding: 10px;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- UTILS --- */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3.5rem;
      height: 3.5rem;
      background-color: var(--primary);
      color: white;
      border: var(--border-width) solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.5rem;
      box-shadow: var(--shadow-hard);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .back-to-top:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 1rem 2rem;
      border: var(--border-width) solid var(--border-color);
      border-radius: 50px;
      font-weight: 700;
      box-shadow: var(--shadow-hard);
      z-index: 3000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success i {
      color: var(--success);
    }

    .toast.info i {
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .archive-grid {
        grid-template-columns: 1fr;
      }

      .modal-header {
        height: 180px;
      }

      .member-list {
        grid-template-columns: 1fr;
      }

      .filter-container {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1><i class="fas fa-scroll"></i> Arsip OSIS Skenpat</h1>
        <p class="subtitle">SMK Negeri 4 Banjarmasin · Periode 2025/2026</p>
        <div class="header-actions">
          <a href="/" class="btn btn-outline" aria-label="Ke menu utama skenpat">
            <i class="fas fa-home" aria-hidden="true"></i>
            <span>Menu Utama</span>
          </a>
          <button class="btn btn-primary" id="themeToggle" aria-label="Alihkan mode gelap">
            <i class="fas fa-moon" aria-hidden="true"></i>
            <span>Mode Gelap</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Search -->
    <section class="search-section" aria-labelledby="searchHeading">
      <div class="search-container">
        <div class="search-icon" aria-hidden="true">
          <i class="fas fa-search"></i>
        </div>
        <input type="search" class="search-input" id="searchInput"
          placeholder="Cari nama ketua, periode, atau pembina..." autocomplete="off" aria-label="Cari arsip OSIS">
      </div>
      <div class="search-stats" id="searchStats" aria-live="polite">
        Memuat data...
      </div>
    </section>

    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="period">
        <i class="fas fa-users"></i> Arsip Periode
      </button>
      <button class="tab-btn" data-tab="supervisor">
        <i class="fas fa-chalkboard-teacher"></i> Arsip Pembina
      </button>
    </div>

    <!-- Period Archive Tab Content -->
    <div class="tab-content active" id="period-tab">
      <div class="filter-container">
        <select class="filter-select" id="periodFilter">
          <option value="all">Semua Periode</option>
          <option value="2025-2026">2025/2026</option>
          <option value="2024-2025">2024/2025</option>
        </select>
        <select class="filter-select" id="sortBy">
          <option value="newest">Terbaru</option>
          <option value="oldest">Terlama</option>
          <option value="name">Nama Ketua</option>
        </select>
        <button class="btn btn-sm btn-outline" id="resetFilters">
          <i class="fas fa-redo"></i> Reset
        </button>
      </div>

      <div class="archive-grid" id="periodArchiveGrid"></div>

      <div class="pagination" id="periodPagination"></div>
    </div>

    <!-- Supervisor Archive Tab Content -->
    <div class="tab-content" id="supervisor-tab">
      <div class="filter-container">
        <select class="filter-select" id="supervisorFilter">
          <option value="all">Semua Pembina</option>
          <option value="active">Masih Aktif</option>
          <option value="former">Mantan Pembina</option>
        </select>
        <select class="filter-select" id="sortBySupervisor">
          <option value="name">Nama</option>
          <option value="period">Periode</option>
        </select>
        <button class="btn btn-sm btn-outline" id="resetSupervisorFilters">
          <i class="fas fa-redo"></i> Reset
        </button>
      </div>

      <div class="archive-grid" id="supervisorArchiveGrid"></div>

      <div class="pagination" id="supervisorPagination"></div>
    </div>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <h3 style="color: var(--primary); margin-bottom: 0.5rem;">OSIS SMK Negeri 4 Banjarmasin</h3>
      <p style="color: var(--text-muted);">© 2026 Membangun Karakter, Meraih Prestasi.</p>
    </footer>
  </div>

  <!-- MODAL DETAIL (New Feature) -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <button class="close-modal" onclick="App.closeModal()">
          <i class="fas fa-times"></i>
        </button>
        <img src="" alt="Detail Image" class="modal-img" id="modalImg">
      </div>
      <div class="modal-body">
        <div id="modalTags"></div>
        <h2 id="modalTitle" style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--primary);">Judul</h2>

        <div class="article-section">
          <h3><i class="fas fa-info-circle"></i> Informasi Utama</h3>
          <div id="modalKeyInfo" style="margin-bottom: 1rem;"></div>
        </div>

        <div class="article-section">
          <h3><i class="fas fa-align-left"></i> Deskripsi Lengkap</h3>
          <div class="article-text" id="modalDesc"></div>
        </div>

        <div class="article-section" id="modalMembersSection" style="display:none;">
          <h3><i class="fas fa-users-cog"></i> Struktur & Anggota</h3>
          <ul class="member-list" id="modalMembers"></ul>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
          <a href="#" class="btn btn-primary" id="modalMembersBtn">
            <i class="fas fa-users"></i> Cek Anggota
          </a>
          <button class="btn btn-outline" onclick="App.closeModal()">
            <i class="fas fa-check"></i> Tutup Detail
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" aria-label="Kembali ke atas">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script>
    // --- APP STATE & DATA ---
    const AppState = {
      currentTab: 'period',
      currentPage: { period: 1, supervisor: 1 },
      filters: {
        period: { search: '', periodFilter: 'all', sortBy: 'newest' },
        supervisor: { search: '', status: 'all', sortBy: 'name' }
      },
      // Data dari snippet pengguna, ditambahkan placeholder gambar
      data: {
        periods: [
          {
            id: 'period-2025-2026',
            period: '2025/2026',
            ketua: 'Corry Laura Beuty Pakpahan',
            wakil: 'Nor Fitriah',
            sekretaris: 'Muhammad Syahrul & Anandha Raisya Oktama Putri',
            bendahara: 'Muhammad Dede Riyadhi & Leonardus Dwi Noverianto',
            pembina: 'Ade Fitriyadi S.Pd.',
            description: '<i>"Bersatu kita wujudkan GARUDA! (Generasi aktif, unggul dan berdaya)"</i></br> </br><b>VISI :</b> Menjadikan OSIS SMK Negeri 4 Banjarmasin sebagai organisasi yag inspiratif, inovatif, dan berkualitas, serta menjadi wadah bagi seluuruh siswa untuk belajar, berkembang, dan berlatih bersama membentuk jiwa kepemimpinan yang berintegritas.</br> </br><b>MISI :</b> <br>1. Menanamkan keimanan sebagai pondasi pembentukan karakter yang jujur, disiplin, dan bertanggung jawab.<br>2. Meneruskan serta mengoptimalkan program kerja yang telah maupun yang belum terlaksana dengan cara yang lebih efektif.<br>3. Menampung dan menyalurkan aspirasi siswa/i sebagai bentuk partisipasi aktif dalam meningkatkan kinerja OSIS SMK Negeri 4 Banjarmasin.<br>4. Merangkul dan menjalin kerja sama antar ekskul, untuk mengembangkan potensi dan minat bakat siswa/i SMK Negeri 4 Banjarmasin.',
            image: 'https://res.cloudinary.com/dahcxjdbl/image/upload/v1769563595/IMG_0102_zgkvji_tuvi9t.webp',
            url: '#',
            modalMembersBtn: '../arsip/org/osis/2025-2026'
          },
          {
            id: 'period-2024-2025',
            period: '2024/2025',
            ketua: 'Muhammad Reno Helmawan',
            wakil: 'Corry Laura Beuty Pakpahan',
            sekretaris: 'Amalia Rahmania & Nur Almira Putri',
            bendahara: 'Arya Tri Nugraha & Muhammad Dede Riyadhi',
            pembina: 'Ade Fitriyadi S.Pd.',
            description: 'Periode transisi yang berfokus pada stabilitas organisasi pasca pandemi. Mencanangkan program digitalisasi administrasi OSIS.',
            image: 'https://res.cloudinary.com/dahcxjdbl/image/upload/v1766220516/reno_hermawan-min-compressed_wbdlnr.jpg',
            url: '#',
            modalMembersBtn: '../arsip/org/osis/2024-2025'
          }
        ],
        supervisors: [
          {
            id: 'supervisor-ade',
            name: 'Ade Fitriyadi S.Pd.',
            period: '2024 - Sekarang',
            status: 'active',
            description: 'Fokus pada pengembangan leadership dan digital literacy. Beliau sangat aktif dalam mendampingi setiap kegiatan ekstrakurikuler dan intra sekolah.',
            image: 'https://res.cloudinary.com/dahcxjdbl/image/upload/v1766220516/ibusilvi_bapaade_ibueka-min-compressed_lrauxz.jpg',
            url: '#'
          },
          {
            id: 'supervisor-nurul',
            name: 'Alm. Nurulmawadah',
            period: '2015 - 2024',
            status: 'former',
            description: 'Mengembangkan program ekstrakurikuler unggulan sekolah. Beliau adalah sosok panutan yang sangat disiplin dan berdedikasi tinggi.',
            image: 'https://picsum.photos/seed/nurul/800/400.jpg',
            url: '#'
          }
        ]
      }
    };

    // --- DOM ELEMENTS ---
    const DOM = {
      themeToggle: document.getElementById('themeToggle'),
      searchInput: document.getElementById('searchInput'),
      searchStats: document.getElementById('searchStats'),
      tabButtons: document.querySelectorAll('.tab-btn'),
      tabContents: document.querySelectorAll('.tab-content'),
      periodFilter: document.getElementById('periodFilter'),
      sortBy: document.getElementById('sortBy'),
      supervisorFilter: document.getElementById('supervisorFilter'),
      sortBySupervisor: document.getElementById('sortBySupervisor'),
      resetFilters: document.getElementById('resetFilters'),
      resetSupervisorFilters: document.getElementById('resetSupervisorFilters'),
      periodArchiveGrid: document.getElementById('periodArchiveGrid'),
      supervisorArchiveGrid: document.getElementById('supervisorArchiveGrid'),
      periodPagination: document.getElementById('periodPagination'),
      supervisorPagination: document.getElementById('supervisorPagination'),
      backToTop: document.getElementById('backToTop'),
      toast: document.getElementById('toast'),
      // Modal Elements
      modal: document.getElementById('detailModal'),
      modalImg: document.getElementById('modalImg'),
      modalTitle: document.getElementById('modalTitle'),
      modalDesc: document.getElementById('modalDesc'),
      modalTags: document.getElementById('modalTags'),
      modalKeyInfo: document.getElementById('modalKeyInfo'),
      modalMembersSection: document.getElementById('modalMembersSection'),
      modalMembersBtn: document.getElementById('modalMembersBtn'),
      modalMembers: document.getElementById('modalMembers')
    };

    // --- MODAL LOGIC (NEW FEATURE) ---
    const App = {
      openModal(id, type) {
        const data = AppState.data[type === 'period' ? 'periods' : 'supervisors'].find(item => item.id === id);
        if (!data) return;

        DOM.modalImg.src = data.image;
        DOM.modalTitle.textContent = type === 'period' ? `Periode ${data.period}` : data.name;

        // Set HTML Content
        DOM.modalDesc.innerHTML = data.description;

        // Render Tags & Info
        let infoHTML = '';
        let membersHTML = '';

        if (type === 'period') {
          DOM.modalTags.innerHTML = `<span class="modal-tag">${data.period}</span> <span class="modal-tag">Ketua: ${data.ketua}</span>`;

          infoHTML = `
                <p><i class="fas fa-user-shield" style="color:var(--primary); width:25px;"></i> <strong>Pembina:</strong> ${data.pembina}</p>
            `;

          membersHTML = `
                <li class="member-item"><i class="fas fa-crown" style="color: gold;"></i> Ketua: ${data.ketua}</li>
                <li class="member-item"><i class="fas fa-user-tie" style="color: var(--accent);"></i> Wakil: ${data.wakil}</li>
                <li class="member-item"><i class="fas fa-pen-nib" style="color: var(--secondary);"></i> Sekretaris: ${data.sekretaris}</li>
                <li class="member-item"><i class="fas fa-coins" style="color: var(--success);"></i> Bendahara: ${data.bendahara}</li>
            `;
          DOM.modalMembersSection.style.display = 'block';
        } else {
          const statusLabel = data.status === 'active' ? 'Masih Aktif' : 'Mantan Pembina';
          DOM.modalTags.innerHTML = `<span class="modal-tag" style="background:${data.status === 'active' ? 'var(--success)' : 'var(--text-muted)'}">${statusLabel}</span>`;

          infoHTML = `
                <p><i class="fas fa-calendar-alt" style="color:var(--primary); width:25px;"></i> <strong>Masa Bakti:</strong> ${data.period}</p>
            `;
          DOM.modalMembersSection.style.display = 'none'; // No detailed list for supervisor in this data
        }

        DOM.modalKeyInfo.innerHTML = infoHTML;
        DOM.modalMembers.innerHTML = membersHTML;

        DOM.modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      },

      closeModal() {
        DOM.modal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    };

    // --- DATA & VIEW SERVICE ---
    const DataService = {
      filterPeriodData() {
        const { search, periodFilter } = AppState.filters.period;
        return AppState.data.periods.filter(item => {
          const query = search.toLowerCase();
          const matchSearch = !search ||
            item.period.toLowerCase().includes(query) ||
            item.ketua.toLowerCase().includes(query) ||
            item.wakil.toLowerCase().includes(query) ||
            item.pembina.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query);
          const matchFilter = periodFilter === 'all' || item.period === periodFilter;
          return matchSearch && matchFilter;
        });
      },
      filterSupervisorData() {
        const { search, status } = AppState.filters.supervisor;
        return AppState.data.supervisors.filter(item => {
          const query = search.toLowerCase();
          const matchSearch = !search ||
            item.name.toLowerCase().includes(query) ||
            item.period.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query);
          const matchFilter = status === 'all' || item.status === status;
          return matchSearch && matchFilter;
        });
      },
      sortData(data, sortBy, type) {
        return [...data].sort((a, b) => {
          if (type === 'period') {
            if (sortBy === 'newest') return b.period.localeCompare(a.period);
            if (sortBy === 'oldest') return a.period.localeCompare(b.period);
            if (sortBy === 'name') return a.ketua.localeCompare(b.ketua);
          } else {
            if (sortBy === 'name') return a.name.localeCompare(b.name);
            if (sortBy === 'period') return b.period.localeCompare(a.period);
          }
          return 0;
        });
      }
    };

    const ViewService = {
      renderPeriodCards() {
        const data = DataService.sortData(DataService.filterPeriodData(), AppState.filters.period.sortBy, 'period');
        const start = (AppState.currentPage.period - 1) * 6;
        const pageData = data.slice(start, start + 6);

        DOM.periodArchiveGrid.innerHTML = pageData.length ? pageData.map(p => `
          <div class="archive-card">
            <div class="archive-header">
              <div class="archive-title">Periode ${p.period}</div>
              <div class="archive-subtitle">Ketua: ${p.ketua}</div>
            </div>
            <img src="${p.image}" alt="Foto OSIS ${p.period}" class="archive-image" loading="lazy">
            <div class="archive-content">
              <p class="archive-desc-preview">${p.description.replace(/<[^>]*>?/gm, '')}</p>
              <div class="archive-actions">
                <button class="btn btn-primary" onclick="App.openModal('${p.id}', 'period')">
                  <i class="fas fa-book-open"></i> Lihat Detail
                </button>
              </div>
            </div>
          </div>
        `).join('') : `<div style="grid-column:1/-1; text-align:center; padding:2rem;">Tidak ada data ditemukan.</div>`;

        this.renderPagination(data.length, AppState.currentPage.period, DOM.periodPagination, 'period');
      },

      renderSupervisorCards() {
        const data = DataService.sortData(DataService.filterSupervisorData(), AppState.filters.supervisor.sortBy, 'supervisor');
        const start = (AppState.currentPage.supervisor - 1) * 6;
        const pageData = data.slice(start, start + 6);

        DOM.supervisorArchiveGrid.innerHTML = pageData.length ? pageData.map(s => `
          <div class="archive-card">
            <div class="archive-header" style="background: var(--accent);">
              <div class="archive-title">${s.name}</div>
              <div class="archive-subtitle">${s.period}</div>
            </div>
            <img src="${s.image}" alt="Foto ${s.name}" class="archive-image" loading="lazy">
            <div class="archive-content">
              <p class="archive-desc-preview">${s.description}</p>
              <div class="archive-actions">
                <button class="btn btn-primary" onclick="App.openModal('${s.id}', 'supervisor')">
                  <i class="fas fa-user-circle"></i> Profil Lengkap
                </button>
              </div>
            </div>
          </div>
        `).join('') : `<div style="grid-column:1/-1; text-align:center; padding:2rem;">Tidak ada data ditemukan.</div>`;

        this.renderPagination(data.length, AppState.currentPage.supervisor, DOM.supervisorPagination, 'supervisor');
      },

      renderPagination(totalItems, currentPage, container, type) {
        const totalPages = Math.ceil(totalItems / 6);
        let html = '';

        // Prev
        html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="EventController.changePage('${type}', -1)"><i class="fas fa-chevron-left"></i></button>`;

        // Numbers (Simple version)
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="EventController.setPage('${type}', ${i})">${i}</button>`;
          } else if (i === currentPage - 2 || i === currentPage + 2) {
            html += `<span style="align-self:center; font-weight:bold;">...</span>`;
          }
        }

        // Next
        html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="EventController.changePage('${type}', 1)"><i class="fas fa-chevron-right"></i></button>`;

        container.innerHTML = html;
      },

      updateStats() {
        const type = AppState.currentTab;
        const total = type === 'period' ? AppState.data.periods.length : AppState.data.supervisors.length;
        const filtered = type === 'period' ? DataService.filterPeriodData().length : DataService.filterSupervisorData().length;

        DOM.searchStats.innerHTML = `Total: <strong>${total}</strong> ${type === 'period' ? 'Periode' : 'Pembina'} · <strong>${filtered}</strong> Ditampilkan`;
      },

      showToast(msg, type = 'info') {
        DOM.toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}"></i> <span>${msg}</span>`;
        DOM.toast.className = `toast show ${type}`;
        setTimeout(() => DOM.toast.className = 'toast', 3000);
      }
    };

    // --- CONTROLLER ---
    const EventController = {
      setupListeners() {
        // Theme
        DOM.themeToggle.addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const newTheme = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', newTheme);
          DOM.themeToggle.innerHTML = `<i class="fas fa-${isDark ? 'moon' : 'sun'}"></i> <span>${isDark ? 'Mode Gelap' : 'Mode Terang'}</span>`;
          ViewService.showToast('Tema berhasil diubah!', 'success');
        });

        // Search
        DOM.searchInput.addEventListener('input', (e) => {
          AppState.filters[AppState.currentTab].search = e.target.value;
          AppState.currentPage[AppState.currentTab] = 1;
          this.refreshView();
        });

        // Tabs
        DOM.tabButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            DOM.tabButtons.forEach(b => b.classList.remove('active'));
            DOM.tabContents.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
            AppState.currentTab = btn.dataset.tab;
            DOM.searchInput.placeholder = AppState.currentTab === 'period' ? 'Cari nama ketua, periode...' : 'Cari nama pembina...';
            this.refreshView();
          });
        });

        // Filters
        DOM.periodFilter.addEventListener('change', (e) => { AppState.filters.period.periodFilter = e.target.value; AppState.currentPage.period = 1; this.refreshView(); });
        DOM.sortBy.addEventListener('change', (e) => { AppState.filters.period.sortBy = e.target.value; this.refreshView(); });
        DOM.supervisorFilter.addEventListener('change', (e) => { AppState.filters.supervisor.status = e.target.value; AppState.currentPage.supervisor = 1; this.refreshView(); });
        DOM.sortBySupervisor.addEventListener('change', (e) => { AppState.filters.supervisor.sortBy = e.target.value; this.refreshView(); });

        // Reset
        DOM.resetFilters.addEventListener('click', () => {
          AppState.filters.period = { search: '', periodFilter: 'all', sortBy: 'newest' };
          DOM.periodFilter.value = 'all'; DOM.sortBy.value = 'newest'; DOM.searchInput.value = '';
          AppState.currentPage.period = 1; this.refreshView(); ViewService.showToast('Filter direset', 'info');
        });
        DOM.resetSupervisorFilters.addEventListener('click', () => {
          AppState.filters.supervisor = { search: '', status: 'all', sortBy: 'name' };
          DOM.supervisorFilter.value = 'all'; DOM.sortBySupervisor.value = 'name'; DOM.searchInput.value = '';
          AppState.currentPage.supervisor = 1; this.refreshView(); ViewService.showToast('Filter direset', 'info');
        });

        // Back to top
        window.addEventListener('scroll', () => {
          DOM.backToTop.classList.toggle('visible', window.scrollY > 300);
        });
        DOM.backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        // Close Modal
        DOM.modal.addEventListener('click', (e) => {
          if (e.target === DOM.modal) App.closeModal();
        });
      },

      refreshView() {
        if (AppState.currentTab === 'period') ViewService.renderPeriodCards();
        else ViewService.renderSupervisorCards();
        ViewService.updateStats();
      },

      changePage(type, dir) {
        AppState.currentPage[type] += dir;
        this.refreshView();
        window.scrollTo({ top: DOM.searchInput.offsetTop - 100, behavior: 'smooth' });
      },

      setPage(type, num) {
        AppState.currentPage[type] = num;
        this.refreshView();
        window.scrollTo({ top: DOM.searchInput.offsetTop - 100, behavior: 'smooth' });
      }
    };

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
      EventController.setupListeners();
      ViewService.renderPeriodCards();
      ViewService.updateStats();
    });
  </script>
</body>

</html>
